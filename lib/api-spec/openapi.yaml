openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Docker Learning Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: challenges
    description: Docker challenges
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: me
    description: Current-user data (requires authentication)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /challenges:
    get:
      operationId: listChallenges
      tags: [challenges]
      summary: List all challenges
      description: Returns all challenges with metadata. Completion/locked state is tracked client-side in localStorage.
      responses:
        "200":
          description: List of challenges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChallengeSummary"

  /challenges/{id}:
    get:
      operationId: getChallenge
      tags: [challenges]
      summary: Get challenge details
      description: Returns full challenge details including starter files and instructions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Challenge details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Challenge"
        "404":
          description: Challenge not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'

  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.

  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the `returnTo` path on success (defaults to `/`) or `/api/login` on failure.

  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.

  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'

  /me/progress:
    get:
      tags: [me]
      operationId: getMyProgress
      summary: Get the signed-in user's progress
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: User progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProgress'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [me]
      operationId: putMyProgress
      summary: Replace the signed-in user's progress
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProgress'
      responses:
        '200':
          description: Updated user progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProgress'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /challenges/{id}/submit:
    post:
      operationId: submitChallenge
      tags: [challenges]
      summary: Submit a challenge solution
      description: Validates submitted Docker files and returns detailed feedback
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeSubmission"
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResult"
        "404":
          description: Challenge not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    SavedFile:
      type: object
      required: [name, content]
      properties:
        name:
          type: string
        content:
          type: string
    UserProgress:
      type: object
      required: [completedIds, submissions]
      properties:
        completedIds:
          type: array
          items:
            type: string
        submissions:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/SavedFile'

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ChallengeSummary:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        difficulty:
          type: string
          enum: [beginner, intermediate, advanced]
        category:
          type: string
          enum: [dockerfile, compose, networking, volumes, multi-stage, security]
        order:
          type: integer
      required:
        - id
        - title
        - description
        - difficulty
        - category
        - order

    ChallengeFile:
      type: object
      properties:
        name:
          type: string
        content:
          type: string
        language:
          type: string
        readonly:
          type: boolean
      required:
        - name
        - content
        - language
        - readonly

    Challenge:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        difficulty:
          type: string
          enum: [beginner, intermediate, advanced]
        category:
          type: string
          enum: [dockerfile, compose, networking, volumes, multi-stage, security]
        order:
          type: integer
        instructions:
          type: string
        hints:
          type: array
          items:
            type: string
        starterFiles:
          type: array
          items:
            $ref: "#/components/schemas/ChallengeFile"
        objectives:
          type: array
          items:
            type: string
        keyLearnings:
          type: array
          items:
            $ref: "#/components/schemas/KeyLearning"
      required:
        - id
        - title
        - description
        - difficulty
        - category
        - order
        - instructions
        - hints
        - starterFiles
        - objectives
        - keyLearnings

    KeyLearning:
      type: object
      properties:
        title:
          type: string
        body:
          type: string
      required:
        - title
        - body

    ChallengeSubmission:
      type: object
      properties:
        files:
          type: array
          items:
            $ref: "#/components/schemas/ChallengeFile"
      required:
        - files

    ValidationCheck:
      type: object
      properties:
        name:
          type: string
        passed:
          type: boolean
        message:
          type: string
      required:
        - name
        - passed
        - message

    ValidationResult:
      type: object
      properties:
        passed:
          type: boolean
        score:
          type: integer
        maxScore:
          type: integer
        checks:
          type: array
          items:
            $ref: "#/components/schemas/ValidationCheck"
        feedback:
          type: string
        output:
          type: string
      required:
        - passed
        - score
        - maxScore
        - checks
        - feedback
        - output

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
