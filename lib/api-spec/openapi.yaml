openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Docker Learning Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: challenges
    description: Docker challenges
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /challenges:
    get:
      operationId: listChallenges
      tags: [challenges]
      summary: List all challenges
      description: Returns all challenges with metadata. Completion/locked state is tracked client-side in localStorage.
      responses:
        "200":
          description: List of challenges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChallengeSummary"

  /challenges/{id}:
    get:
      operationId: getChallenge
      tags: [challenges]
      summary: Get challenge details
      description: Returns full challenge details including starter files and instructions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Challenge details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Challenge"
        "404":
          description: Challenge not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /challenges/{id}/submit:
    post:
      operationId: submitChallenge
      tags: [challenges]
      summary: Submit a challenge solution
      description: Validates submitted Docker files and returns detailed feedback
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeSubmission"
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResult"
        "404":
          description: Challenge not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ChallengeSummary:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        difficulty:
          type: string
          enum: [beginner, intermediate, advanced]
        category:
          type: string
          enum: [dockerfile, compose, networking, volumes, multi-stage, security]
        order:
          type: integer
      required:
        - id
        - title
        - description
        - difficulty
        - category
        - order

    ChallengeFile:
      type: object
      properties:
        name:
          type: string
        content:
          type: string
        language:
          type: string
        readonly:
          type: boolean
      required:
        - name
        - content
        - language
        - readonly

    Challenge:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        difficulty:
          type: string
          enum: [beginner, intermediate, advanced]
        category:
          type: string
          enum: [dockerfile, compose, networking, volumes, multi-stage, security]
        order:
          type: integer
        instructions:
          type: string
        hints:
          type: array
          items:
            type: string
        starterFiles:
          type: array
          items:
            $ref: "#/components/schemas/ChallengeFile"
        objectives:
          type: array
          items:
            type: string
      required:
        - id
        - title
        - description
        - difficulty
        - category
        - order
        - instructions
        - hints
        - starterFiles
        - objectives

    ChallengeSubmission:
      type: object
      properties:
        files:
          type: array
          items:
            $ref: "#/components/schemas/ChallengeFile"
      required:
        - files

    ValidationCheck:
      type: object
      properties:
        name:
          type: string
        passed:
          type: boolean
        message:
          type: string
      required:
        - name
        - passed
        - message

    ValidationResult:
      type: object
      properties:
        passed:
          type: boolean
        score:
          type: integer
        maxScore:
          type: integer
        checks:
          type: array
          items:
            $ref: "#/components/schemas/ValidationCheck"
        feedback:
          type: string
        output:
          type: string
      required:
        - passed
        - score
        - maxScore
        - checks
        - feedback
        - output

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
