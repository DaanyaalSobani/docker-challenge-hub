kind = "web"
previewPath = "/"
title = "Docker Learning Platform"
version = "1.0.0"
id = "artifacts/docker-learn"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23372

[services.development]
run = "pnpm --filter @workspace/docker-learn run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/docker-learn", "run", "build" ]
publicDir = "artifacts/docker-learn/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23372"
BASE_PATH = "/"
