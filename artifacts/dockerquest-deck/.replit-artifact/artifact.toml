kind = "slides"
previewPath = "/dockerquest-deck/"
title = "DockerQuest Build Story"
version = "1.0.0"
id = "artifacts/dockerquest-deck"
router = "path"

[[integratedSkills]]
name = "slides"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/dockerquest-deck/" ]
localPort = 20345

[services.development]
run = "pnpm --filter @workspace/dockerquest-deck run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dockerquest-deck", "run", "build" ]
publicDir = "artifacts/dockerquest-deck/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20345"
BASE_PATH = "/dockerquest-deck/"
